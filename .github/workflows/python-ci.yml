name: Python CI

# Reusable workflow: pre-commit, ruff, mypy, the pytest matrix and an optional strict docs
# build for a uv project. Call it from a repository's CI workflow:
#
#   jobs:
#     ci:
#       uses: kubex-py/.github/.github/workflows/python-ci.yml@main
#       with:
#         test-sync-args: --all-extras

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory of the uv project, relative to the repository root.
        type: string
        default: "."
      python-versions:
        description: JSON list of Python versions for the test matrix. A "t" suffix is a free-threaded build.
        type: string
        default: '["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]'
      lint-python-version:
        description: Python version for ruff and mypy.
        type: string
        default: "3.14"
      sync-args:
        description: Arguments for every `uv sync`. The default fails when uv.lock is out of date.
        type: string
        default: "--locked"
      test-sync-args:
        description: Extra `uv sync` arguments for mypy and the tests, e.g. `--all-extras`.
        type: string
        default: ""
      pre-commit:
        description: Run pre-commit on all files. Needs a .pre-commit-config.yaml at the repository root.
        type: boolean
        default: true
      mypy-args:
        description: Arguments for mypy.
        type: string
        default: "."
      pytest-args:
        description: Arguments for pytest.
        type: string
        default: ""
      docs:
        description: Build the mkdocs site with --strict.
        type: boolean
        default: false
      docs-group:
        description: The dependency group with mkdocs and its plugins.
        type: string
        default: docs
      docs-python-version:
        description: Python version for the docs build.
        type: string
        default: "3.13"
      lychee-args:
        description: When set, check the docs links with lychee and these arguments, e.g. `--config lychee.toml docs/`.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pre-commit:
    if: inputs.pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure

  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      UV_PYTHON: ${{ inputs.lint-python-version }}
      SYNC_ARGS: ${{ inputs.sync-args }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install dependencies
        run: uv sync $SYNC_ARGS
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      UV_PYTHON: ${{ inputs.lint-python-version }}
      SYNC_ARGS: ${{ inputs.sync-args }} ${{ inputs.test-sync-args }}
      MYPY_ARGS: ${{ inputs.mypy-args }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install dependencies
        run: uv sync $SYNC_ARGS
      - name: mypy
        run: uv run --no-sync mypy $MYPY_ARGS

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      SYNC_ARGS: ${{ inputs.sync-args }} ${{ inputs.test-sync-args }}
      PYTEST_ARGS: ${{ inputs.pytest-args }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install dependencies
        run: uv sync $SYNC_ARGS
      # Otherwise tests that need a free-threaded build would silently skip.
      - name: Check the interpreter is free-threaded
        if: endsWith(matrix.python-version, 't')
        run: uv run --no-sync python -c "import sys, sysconfig; sys.exit(0 if sysconfig.get_config_var('Py_GIL_DISABLED') else 'not a free-threaded build')"
      - name: pytest
        run: uv run --no-sync pytest $PYTEST_ARGS

  docs:
    if: inputs.docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      UV_PYTHON: ${{ inputs.docs-python-version }}
      SYNC_ARGS: ${{ inputs.sync-args }}
      DOCS_GROUP: ${{ inputs.docs-group }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install docs dependencies
        run: uv sync $SYNC_ARGS --group "$DOCS_GROUP"
      - name: Build docs (strict)
        run: uv run --no-sync mkdocs build --strict
      - name: Check links
        if: inputs.lychee-args != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: ${{ inputs.lychee-args }}
          workingDirectory: ${{ inputs.working-directory }}
          fail: true
