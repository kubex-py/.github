name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: kubex-py/.github/.github/workflows/python-ci.yml@main
    # All inputs are optional; see the workflow for the full list.
