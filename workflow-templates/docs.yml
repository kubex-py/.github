# Save as .github/workflows/docs.yaml (the org names workflow files .yaml).

name: Docs

on:
  push:
    branches: [$default-branch]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version label to deploy
        required: false
        default: dev

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: kubex-py/.github/.github/workflows/docs-mike.yml@main
    permissions:
      contents: write
    with:
      version-label: ${{ inputs.version || 'dev' }}
